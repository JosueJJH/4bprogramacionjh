<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DragonBallZ</title>
</head>
<body>
    <style>
        :root{
            --color-primario: #B80C09;
            --color-secundario: #C4B7CB;
            --color-terciario: #01BAEF;
            --color-cuarto: #031A6B;
            --color-quinto: #00A676;

        }
        * {
            box-sizing: border-box;


        }
        body {
            background-color: var(--color-primario);
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        header{
            padding: 15px;
            display: flex;
            justify-content: flex;
            background-color: var(--color-secundario);
        }
        .search{
            background-color: var(--color-primario);
            border: 2px solid var(--color-terciario);
            border-radius: 50px;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 15px;
            padding: 8px;
            color: var(--color-terciario)
        }
        .search::placeholder{
            color: var(--color-quinto);
            
            
        }
        .search:focus{
            outline: none;
            background-color: var(--color-quinto);
        }
        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;

        }
        .personaje{
            width: 400px;
            margin: 15px;
            background-color: var(--color-secundario);
            box-shadow: 0 5px 5px black;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .personaje img{
            width: 80%;
            height: 40px;
            object-fit: contain;

        }
        .personaje-info{
            color: var(--color-terciario);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            padding: 15px 15px 15px;
            letter-spacing: 5px;
        }
        .personaje-info h3{
            color: var(--color-terciario);
            margin-top: 0;
        }
        .overview{
            background-color: var(--color-primario);
            padding: 1rem;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101);
            overflow-y: auto;
            transition: transform 0.3 ease-in;

        }
        .personaje:hover .overview{
            transform: translateY(o);

        }



    </style>
    <header>
        <form id="form">
            <img src="Dragon_Ball.webp" alt="logo" style="width: 100px;">
            <input type="text" id="search" class="search" placeholder="Buscar Personaje">
        </form>
    </header>
    <script>
        const API_URL = 'https://dragonball-api.com/api/characters';

        const main= document.getElementById('main');
        const form= document.getElementById('form');
        const search= document.getElementById('search');

        getCharacters(API_URL)
        async function getCharacters(url) {
            const res = await fetch(url);
            const data = await res.json();
            showCharacters(data.items || data);


            showCharacters(data.results);
            
        }
        function showCharacters(characters){
            main.innerHTML='';

            characters.forEach((character)  => {
                const {name, image, ki, maxKi, description, race} = char;
                const personaje = document.createElement('div');
                characterEl.classList.add('personaje');
                characterEl.innerHTML = `
                <img src ="${image}" alt = "${name}">
                <div class="personaje-info">
                <h1>${id}/h1>  <h3>${name}</h3>  
                    <br>
                    ${race}
                    </div>
                    <div class = "descripcion">
                        ${descripcion}
                        <p><strong>Ki:</strong> ${ki}</p>
                        <p><strong>Max ki:</strong> ${maxki}</p>
                        <p>${descripcion || "Sin descripcion disponible"}</p>
                        </div>`
                            main.appendChild(charElement);

            })
          
        }
        form.addEventListener('submit',(e) => {
            e.preventDefault()
            const searchTerm = search.value.toLowerCase();
            if(searchTerm && searchTerm !== ''){
              getCharacters(API_URL + `?name=${searchTerm}`)
              search.value ="";
                
                  
            }else{
                window.location.reload();
            }
           
        });

      

    </script>
</body>
</html>
