    <style>
        th { 
            background-color:rgb(141, 27, 27);
            color: white;
            text-align: center;
            padding: 10px;
            font-family: 'LT Shortcake';
        }
        *{
            box-sizing: border-box;
        }
        body{
            background-color: rgba(255, 255, 255, 0.822);
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
        }

        header{
            padding: 1rem;
            display: flex;
            justify-content: flex-end;
            background-color: rgb(241, 78, 78);
        }

        .search{
            background-color: rgba(226, 238, 64, 0.993);
            border: 2px solid var(--seconday color);
            border-radius: 50px;
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 15px;
            padding:0.5rem;
            color: #000;
        }

        .search::placeholder{
            color: #7378c5;
        }

        .search:focus{
            outline: none;
            background-color: rgb(205, 35, 228);
        }

        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .movie{
            width: 300px;
            margin: 1rem;
            background-color: #38e2a1;
            box-shadow: 0 4px 5px #765;
            position: relative;
            overflow: hidden;
            border-radius: 3px;
        }

        .movie img{
            width: 100%;
        }

        .movie-info{
            color: antiquewhite;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap:0.2rem;
            padding: 0.5rem 1rem 1rem;
            letter-spacing: 0.5px;
        }

        .movie-info h3{
            margin-top: 0;
        }

        .movie-info span{
            background-color: black;
            padding:0.25rem 0.5rem;
            border-radius: 3px;
            font-weight: bold;
        }

        .movie-info span.blue{
            color:blue;
        }

        .movie-info span.white{
            color:white;
        }

        .movie-info span.red{
            color:red;
        }

        .overview{
            background-color: #fff;
            padding: 2rem;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow: auto;
            transition: transform 0.3s ease-in;
        }

        .movie:hover .overview{
            transform: translateY(0);
        }
    </style>

    <header>
        <form id="form">
            <input type="text" id="search" class="search" placeholder="Buscar peliculas">
        </form>
    </header>

    <main id="main"></main>

    <script>
        const API_URL = 'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w1280';
        const SEARCH_API = 'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=';

        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getMovies(API_URL);

        async function getMovies(url) {
            const res = await fetch(url);
            const data = await res.json();
            showMovies(data.results);
        }

        function showMovies(movies) {
            main.innerHTML = '';

            movies.forEach((movie) => {
                //esta linea linea va a poner todos los elementos al principio, para eso el forEach, es similaral "for", pero el for tiene su inicializacion, condicion y limite 
                const { title, poster_path, vote_average, overview } = movie;
                // esta linea pone lo que nos va a interesar API que vamos a obtener
                const movieElement = document.createElement('div');
                movieElement.classList.add('movie');

                movieElement.innerHTML = `
                    <img src="${IMG_PATH + poster_path}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <span class="${getClassByRate(vote_average)}">${vote_average}</span>
                    </div>
                    <div class="overview">
                        <h3>Overview</h3>
                        ${overview}
                    </div>
                `;
                main.appendChild(movieElement);
            });
        }

        function getClassByRate(vote) {
            if (vote >= 8) {
                return 'blue';
            } else if (vote >= 5) {
                return 'white';
            } else {
                return 'red';
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = search.value;

            if (searchTerm && searchTerm !== '') {
                getMovies(SEARCH_API + searchTerm);
                search.value = '';
            } else {
                window.location.reload();
            }
        });
    </script>
